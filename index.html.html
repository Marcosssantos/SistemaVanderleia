<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Recibo - Eletroporto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; color: #333; }
  .header { background: linear-gradient(135deg, #0a5c9e, #ff6f00); color: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
  .logo { font-size: 32px; font-weight: bold; color: #ff6f00; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  .logo span { color: #ffd700; }
  .form-control { border: none; border-bottom: 2px solid #ddd; border-radius: 0; padding: 10px 0; margin-bottom: 15px; background: transparent; }
  .form-control:focus { border-bottom-color: #0a5c9e; box-shadow: none; }
  .table { margin-top: 20px; border-radius: 10px; overflow: hidden; }
  .table th { background: #0a5c9e; color: white; }
  .total { text-align: right; font-weight: bold; font-size: 1.2em; margin-top: 20px; }
  .assinatura { margin-top: 60px; }
  .linha-ass { border-top: 2px solid #333; width: 100%; text-align: center; padding-top: 10px; font-weight: 500; }
  .btn-primary { background: #0a5c9e; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 500; transition: all 0.3s; }
  .btn-primary:hover { background: #084a7a; transform: translateY(-2px); }
  .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 15px; }
  .card-body { padding: 30px; }
  h2 { color: #0a5c9e; text-align: center; margin-bottom: 30px; }
</style>
</head>
<body>
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-lg-10 col-xl-8">
      <div class="card" id="recibo-content">
        <div class="card-body">
          <div class="header d-flex justify-content-between align-items-center">
            <div class="logo">⚡ ELETRO<span>PORTO</span></div>
            <div class="company-info text-end">
              <div><strong>Telefone:</strong> (11) 95999-0780</div>
              <div><strong>Endereço:</strong> Rua Amaralina, Vila São Nicolau, Jandira, SP</div>
              <div><strong>CEP:</strong> 06620-000</div>
            </div>
          </div>

          <h2>RECIBO</h2>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="recibo-num" class="form-label">Recibo Nº:</label>
              <input type="text" id="recibo-num" class="form-control" placeholder="001">
            </div>
            <div class="col-md-6">
              <label for="data" class="form-label">Data:</label>
              <input type="date" id="data" class="form-control">
            </div>
          </div>

          <div class="mb-3">
            <label for="cliente" class="form-label">Recebi de:</label>
            <input type="text" id="cliente" class="form-control" placeholder="Nome do cliente">
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="cpf" class="form-label">CPF/CNPJ:</label>
              <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00">
            </div>
            <div class="col-md-6">
              <label for="endereco" class="form-label">Endereço:</label>
              <input type="text" id="endereco" class="form-control" placeholder="Rua, número, bairro, cidade">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="valor" class="form-label">Valor De Serviço: R$</label>
              <input type="text" id="valor" class="form-control" placeholder="0,00">
            </div>
            <div class="col-md-6">
              <label for="extenso" class="form-label">Valor Por extenso: ex "Dez Reais"</label>
              <input type="text" id="extenso" class="form-control" placeholder="">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Referente a:</label>
            <textarea class="form-control" rows="3" placeholder="Descrição geral do serviço/produto"></textarea>
          </div>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>DESCRIÇÃO</th>
                <th>QTD</th>
                <th>VALOR UNIT.</th>
                <th>TOTAL</th>
              </tr>
            </thead>
            <tbody id="tabela-itens">
              <tr class="item-row">
                <td><input type="text" class="form-control border-0" placeholder="Descrever o serviço ou produto"></td>
                <td><input type="number" class="form-control border-0 qty-input" placeholder="1"></td>
                <td><input type="text" class="form-control border-0 valor-input" placeholder="0,00"></td>
                <td><input type="text" class="form-control border-0 total-input" placeholder="0,00" readonly></td>
              </tr>
            </tbody>
          </table>
          <button class="btn btn-sm btn-success mt-2" id="btn-adicionar-item" type="button">+ Adicionar item</button>

          <div class="total">TOTAL GERAL: R$ <input type="text" class="form-control d-inline-block w-auto border-0" placeholder="0,00"></div>

          <div class="assinatura row">
            <div class="col-md-6">
              <div class="linha-ass">Assinatura do Emissor</div>
            </div>
            <div class="col-md-6">
              <div class="linha-ass">Assinatura do Cliente</div>
            </div>
          </div>

          <div class="text-center mt-4">
            <button class="btn btn-primary" onclick="downloadPDF()">Baixar PDF</button>
            <button class="btn btn-success ms-2" id="btn-whatsapp">📱 Enviar por WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<script>
  function downloadPDF() {
    const element = document.getElementById('recibo-content');
    const opt = {
      margin: 0.4,
      filename: 'recibo-eletroporto.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  function calcularTotal() {
    const linhas = document.querySelectorAll('tbody tr');
    let totalGeral = 0;
    linhas.forEach(linha => {
      const qtd = parseFloat(linha.querySelector('.qty-input').value) || 0;
      const valorUnit = parseFloat(linha.querySelector('.valor-input').value.replace(',', '.')) || 0;
      const total = qtd * valorUnit;
      linha.querySelector('.total-input').value = total.toFixed(2).replace('.', ',');
      totalGeral += total;
    });
    const valorServico = parseFloat(document.getElementById('valor').value.replace(',', '.')) || 0;
    totalGeral += valorServico;
    document.querySelector('.total input').value = totalGeral.toFixed(2).replace('.', ',');
  }

  document.getElementById('tabela-itens').addEventListener('input', calcularTotal);
  document.getElementById('valor').addEventListener('input', calcularTotal);

  // Adicionar novos itens na tabela
  document.getElementById('btn-adicionar-item').addEventListener('click', function() {
    const tabela = document.getElementById('tabela-itens');
    const newRow = document.createElement('tr');
    newRow.className = 'item-row';
    newRow.innerHTML = `
      <td><input type="text" class="form-control border-0" placeholder="Descrever o serviço ou produto"></td>
      <td><input type="number" class="form-control border-0 qty-input" placeholder="1"></td>
      <td><input type="text" class="form-control border-0 valor-input" placeholder="0,00"></td>
      <td><input type="text" class="form-control border-0 total-input" placeholder="0,00" readonly></td>
    `;
    tabela.appendChild(newRow);
  });

  // Enviar por WhatsApp
  document.getElementById('btn-whatsapp').addEventListener('click', function() {
    const cliente = document.getElementById('cliente').value || 'Cliente';
    const recibo = document.getElementById('recibo-num').value || '001';
    const valor = document.querySelector('.total input').value || '0,00';
    const telefone = '5511959990780';
    const referente = document.querySelector('textarea[placeholder*="Descrição geral"]').value || 'Descrição geral';

    let itens = 'ITENS:\n';
    document.querySelectorAll('.item-row').forEach((row, index) => {
      const descricao = row.cells[0].querySelector('input').value || 'Item sem descrição';
      const qtd = row.cells[1].querySelector('input').value || '0';
      const valor = row.cells[2].querySelector('input').value || '0,00';
      const total = row.cells[3].querySelector('input').value || '0,00';
      itens += `${index + 1}. ${descricao} - Qtd: ${qtd} - Valor Unit.: R$ ${valor} - Total: R$ ${total}\n`;
    });

    const mensagem = `Olá! Segue o comprovante do recibo:\n\nRecibo Nº: ${recibo}\nCliente: ${cliente}\nReferente a: ${referente}\nValor Total: R$ ${valor}\n\n${itens}\nEletroporto`;
    
    const url = `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;
    window.open(url, '_blank');
  });
</script>
</body>
</html>
